<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Crack of All Trades badge logo: a winking cartoon handyman bust with a hard hat, in a circular emblem with a wrench behind the shoulders">
  <circle cx="50" cy="50" r="47" fill="#12203a" stroke="#f2b632" stroke-width="4"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#ffd23f" stroke-width="1.5" opacity="0.5"/>

  <!-- wrench, behind shoulders -->
  <line x1="18" y1="90" x2="58" y2="52" stroke="#f2b632" stroke-width="7" stroke-linecap="round"/>
  <circle cx="16" cy="92" r="6" fill="#f2b632" stroke="#181410" stroke-width="2.5"/>
  <circle cx="60" cy="50" r="6" fill="#f2b632" stroke="#181410" stroke-width="2.5"/>

  <!-- shoulders / jumpsuit -->
  <path d="M20 84 Q25 56 50 54 Q75 56 80 84 Z" fill="#1d3a5f" stroke="#181410" stroke-width="3"/>
  <path d="M42 58 L50 70 L58 58" fill="none" stroke="#f2e6c8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

