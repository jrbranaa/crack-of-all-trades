  <path d="M54 39 Q58 35 62 39" fill="none" stroke="#181410" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M41 47 Q50 54 58 47" fill="none" stroke="#181410" stroke-width="3" stroke-linecap="round"/>
</svg>
