# Block direct HTTP access to app secrets, stored submissions, and the
# vendored PHPMailer library — none of these should ever be served as a
# response body, only read by index.php itself.
<FilesMatch "^(config\.php|config\.sample\.php|submissions\.json)$">
    Require all denied
</FilesMatch>

<Directory "/var/www/html/vendor">
    Require all denied
</Directory>
